set_firmware_available:
  name: Set firmware available
  description: >-
    Test helper — toggles whether the fake printer reports a firmware update as
    available (drives the fake update entity between on/off for the e2e tiers).
  fields:
    available:
      name: Available
      description: Whether a firmware update should be reported as available.
      required: false
      default: true
      selector:
        boolean:

advance_usage_hours:
  name: Advance usage hours
  description: >-
    Test helper — winds the fake printer's cumulative usage-hours counter forward, so
    the e2e tiers can watch a Home Keeper usage task arm without real print time.
  fields:
    hours:
      name: Hours
      description: How many hours to add to the counter.
      required: false
      default: 1
      selector:
        number:
          mode: box
          step: any
